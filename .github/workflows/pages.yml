name: Publish site
# The files in web/ are sent here from the team's own repository; every push publishes them.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp this release
        run: sed -i "s/const VERSION = '[^']*'/const VERSION = '${GITHUB_SHA::10}'/" web/sw.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
          include-hidden-files: true          # web/.well-known/assetlinks.json: the Android app shows the site full screen only if this file is served
  # A job of its own: the list of a run's artifacts can lag a moment behind an upload, and a deploy in
  # the same job as the upload then finds nothing to publish (actions/deploy-pages issue 451).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
