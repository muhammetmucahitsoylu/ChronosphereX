<style>

  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); -webkit-text-size-adjust: 100%; }
  a { color: inherit; }
  [hidden] { display: none !important; }
  .wrap { max-width: 600px; margin: 0 auto; padding: 14px 16px 40px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

  .logo i { width: 15px; height: 15px; border-radius: 50%; background: var(--ember); display: inline-block; }
  select { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; font: 14px var(--sans); }
  h1 { font: 400 38px/1.08 var(--serif); margin: 22px 0 8px; }
  .lede { color: var(--ink-2); margin: 0 0 16px; font-size: 15.5px; }
  /* the question: one year, and the promise about it right under the box */
  #ask { display: flex; gap: 10px; align-items: stretch; }
  #year { flex: 1; min-width: 0; max-width: 190px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; font: 500 26px var(--mono); letter-spacing: .04em; }
  #year:focus { outline: 2px solid var(--gold); outline-offset: 2px; }
  #year::placeholder { color: var(--ink-3); }
  .private { color: var(--ink-3); font-size: 13.5px; margin: 8px 0 0; }
  #bad { color: var(--gold); font-size: 14.5px; margin: 8px 0 0; min-height: 1.5em; }
  button, .btn { font: 600 15px var(--sans); border-radius: 999px; padding: 11px 20px; min-height: 46px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
  button.go, .btn.go { background: var(--ember); border-color: var(--ember); color: #1b0b02; }
  button:focus-visible, .btn:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  /* the answer: the star's picture, its name, the sentence the whole page is for */
  #answer { margin-top: 6px; }
  .stage { position: relative; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: #000; }
  .stage img { display: block; width: 100%; height: auto; aspect-ratio: 1; }
  .stage .yr { position: absolute; left: 12px; bottom: 8px; font: 500 44px/1 var(--mono); color: var(--gold); text-shadow: 0 0 6px #000, 0 0 2px #000; }
  .near { color: var(--ink-2); font-size: 14.5px; margin: 16px 0 10px; }
  #name { font: 400 40px/1.08 var(--serif); margin: 16px 0 0; }
  #where { color: var(--ink-2); font: 500 13.5px var(--mono); letter-spacing: .03em; margin: 4px 0 0; }
  #says { font-size: 17px; margin: 10px 0 0; }
  #says b { color: var(--gold); font-weight: 600; }
  #eye { color: var(--ink-2); font-size: 15px; margin: 6px 0 0; }
  .btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .fine { color: var(--ink-3); font-size: 13.5px; margin-top: 22px; }
  /* a wide screen: the picture on the left, the star's name, sentence and buttons beside it, all in one view */
  @media (min-width: 900px) and (min-height: 501px) {
    body.shown .wrap { max-width: 1040px; }
    body.shown h1, body.shown .lede, body.shown #asking { max-width: 640px; }
    body.shown #answer { display: grid; grid-template-columns: minmax(0, 480px) minmax(0, 1fr); grid-template-rows: repeat(7, auto) 1fr; column-gap: 40px; margin-top: 4px; }
    body.shown #answer > * { grid-column: 2; }
    body.shown #answer > .near { grid-column: 1 / -1; grid-row: 1; }
    body.shown #name { grid-row: 2; } body.shown #where { grid-row: 3; } body.shown #says { grid-row: 4; }
    body.shown #eye { grid-row: 5; } body.shown #answer > .btns { grid-row: 6; } body.shown #answer > .fine { grid-row: 7; }
    body.shown #answer > .stage { grid-column: 1; grid-row: 2 / 10; align-self: start; }
    body.shown #name { margin-top: 0; font-size: 54px; }
    body.shown #where { margin-top: 8px; }
    body.shown #says { font-size: 19px; margin-top: 18px; }
    body.shown #eye { margin-top: 8px; }
    body.shown .btns { margin-top: 22px; }
  }
  /* a phone held sideways: the picture on the left, as tall as the screen; the words and the buttons beside it */
  @media (orientation: landscape) and (max-height: 500px) and (min-width: 600px) {
    body.shown .wrap { max-width: none; margin: 0; padding: 10px 16px 16px calc(100vh + 16px + env(safe-area-inset-left, 0px)); }

    .logo { font-size: 22px; }
    h1 { font-size: 28px; margin: 10px 0 4px; }
    .lede { font-size: 14.5px; margin-bottom: 10px; }
    #name { font-size: 30px; margin-top: 8px; }
    #says { font-size: 15.5px; margin-top: 6px; }

    .btns { gap: 8px; margin-top: 10px; }
    button, .btn { min-height: 42px; padding: 8px 16px; font-size: 14.5px; }
    .fine { margin-top: 12px; font-size: 12.5px; }

const conName = c => { c = (c || '').trim(); return (lang === 'tr' && CON_TR[c]) || c; };
document.documentElement.lang = lang; document.title = `${T.title} · ChronosphereX`;
$('lang').value = lang; $('lang').onchange = e => { location.search = `?lang=${e.target.value}`; };
for (const [id, key] of [['title', 'title'], ['intro', 'intro'], ['yearlabel', 'label'], ['go', 'go'], ['private', 'priv'], ['share', 'share'], ['map', 'map'], ['again', 'again'], ['tool', 'tool']]) $(id).textContent = T[key];
$('tool').href = `./?lang=${lang}`; document.querySelector('.logo').href = `./?lang=${lang}`;

let STARS = [], shown = null;
// The year as a number with a fraction: light that arrives now from a star d light-years away set out in the year floor(now - d).
const NOW = (() => { const d = new Date(), y = d.getFullYear(), a = new Date(y, 0, 1), b = new Date(y + 1, 0, 1); return y + (d - a) / (b - a); })();
const leftIn = s => Math.floor(NOW - s.d);
const slug = name => name.normalize('NFKD').replace(/[^\x00-\x7f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
const SURE = 0.34;          // light-years: a distance known this well names its year
/** The star for a year: of those whose light of tonight set out that year, the best known; failing that, the one
 *  nearest in distance. `y` is the year to show for it, `near` whether that is another year than the one asked for:
 *  a star whose own uncertainty covers the year asked for is that year's star, as well as anyone can say. */
function pick(year) {
  const exact = STARS.filter(s => leftIn(s) === year).sort((a, b) => a.w - b.w);
  if (exact.length) return { star: exact[0], y: year, near: false };
  const want = NOW - (year + 0.5);
  const star = STARS.reduce((best, s) => (Math.abs(s.d - want) < Math.abs(best.d - want) ? s : best));
  const covers = star.e > SURE && Math.abs(star.d - want) <= Math.max(1.5, star.e);
  return { star, y: covers ? year : leftIn(star), near: !covers };
}
function show(year) {
  $('bad').textContent = '';
  if (!STARS.length) { $('bad').textContent = '…'; return; }
  const first = Math.max(1, Math.min(...STARS.map(leftIn))), last = Math.max(...STARS.map(leftIn));
  if (!Number.isInteger(year) || year < first || year > Math.floor(NOW)) { $('bad').textContent = fill(T.bad, { a: first, b: Math.floor(NOW) }); return; }
  // a year whose light is still on its way: the nearest star of all, which is what the words then speak of
  const young = year > last, { star, y, near } = young ? (s => ({ star: s, y: leftIn(s), near: true }))(STARS.reduce((a, b) => (b.d < a.d ? b : a))) : pick(year);
  const sure = star.e <= SURE, give = Math.max(1, Math.round(star.e));
  shown = { star, y, sure };
  $('near').hidden = !near;
  $('near').textContent = young ? fill(T.young, { y: year, py: last }) : T.near;
  $('pic').src = `stars/${slug(star.n)}.webp`; $('pic').alt = star.n; $('yr').textContent = sure ? y : `≈${y}`;
  $('name').textContent = star.n;
  $('where').textContent = [star.b, conName(star.con), fill(T.far, { n: num(star.d, star.d < 300 ? 1 : 0) })].filter(Boolean).join(' · ');
  $('says').innerHTML = sure ? fill(T.left, { name: star.n, y }) : fill(T.about, { name: star.n, y, yrs: T.yrs(give) });
  $('eye').textContent = star.v <= 4.5 ? T.eye1 : star.v <= 6 ? T.eye2 : T.eye3;
  $('map').href = `./?ra=${star.ra}&dec=${star.dec}&fov=5&lang=${lang}`;
  $('fine').textContent = fill(T.fine, { d: num(star.d, 2), e: num(star.e, 2) });
  $('answer').hidden = false; document.body.classList.add('shown');
  $('year').blur();
  const reach = () => { if (shown) $('answer').scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); };
  reach(); setTimeout(reach, 500);          // and again once the phone's keyboard has gone: where the page grows back as it closes (the app), that growth stops the first scroll halfway
}
$('ask').onsubmit = e => { e.preventDefault(); const typed = $('year').value.trim(); show(/^\d{1,4}$/.test(typed) ? +typed : NaN); };
$('again').onclick = () => { $('answer').hidden = true; document.body.classList.remove('shown'); shown = null; $('year').value = ''; window.scrollTo({ top: 0 }); $('year').focus(); };

/** A picture to pass on, the size of a phone's story: the star, its name, the sentence, the site's name. */
async function card() {
  const { star, y, sure } = shown, W = 1080, H = 1920, cv = document.createElement('canvas'), x = cv.getContext('2d');
  cv.width = W; cv.height = H;
  try { await document.fonts.ready; } catch { /* the fallback faces will do */ }
  const st = getComputedStyle(document.documentElement), font = v => st.getPropertyValue(v).trim();
  x.fillStyle = '#0a0908'; x.fillRect(0, 0, W, H);
  x.fillStyle = '#ff7b39'; x.beginPath(); x.arc(92, 136, 20, 0, 2 * Math.PI); x.fill();
  x.fillStyle = '#f3eee6'; x.font = `italic 400 64px ${font('--serif')}`; x.textBaseline = 'middle'; x.fillText('ChronosphereX', 132, 136);
  const img = $('pic'), S = 960, px = 60, py = 240;
  x.save(); x.beginPath(); x.roundRect(px, py, S, S, 40); x.clip();
  if (img.complete && img.naturalWidth) x.drawImage(img, px, py, S, S); else { x.fillStyle = '#000'; x.fillRect(px, py, S, S); }
  x.restore();
  x.textBaseline = 'alphabetic';
  x.fillStyle = '#f3eee6'; let size = 120; x.font = `400 ${size}px ${font('--serif')}`;
  while (x.measureText(star.n).width > W - 120 && size > 60) { size -= 6; x.font = `400 ${size}px ${font('--serif')}`; }
  x.fillText(star.n, 60, 1350);
  x.fillStyle = '#b0a79a'; x.font = `500 38px ${font('--mono')}`; x.fillText([conName(star.con), fill(T.far, { n: num(star.d, star.d < 300 ? 1 : 0) })].join(' · '), 62, 1420);
  x.fillStyle = '#f3eee6'; x.font = `400 58px ${font('--sans')}`; x.fillText(T.card1, 60, 1560);
  // the second line, with the year in the colour of the year on the picture
  const [before, after] = (sure ? T.card2 : T.card2a).split('{y}'); let at = 60;
  for (const [text, colour] of [[before, '#f3eee6'], [String(y), '#f2c14e'], [after, '#f3eee6']]) { x.fillStyle = colour; x.font = `${colour === '#f2c14e' ? 600 : 400} 58px ${font('--sans')}`; x.fillText(text, at, 1640); at += x.measureText(text).width; }
  x.fillStyle = '#8a8175'; x.font = `400 36px ${font('--mono')}`; x.fillText('chronospherex.com/star.html', 60, 1820);
  return new Promise(done => cv.toBlob(done, 'image/png'));
}
$('share').onclick = async () => {
  if (!shown) return;
  const text = fill(shown.sure ? T.shareText : T.shareTextA, { name: shown.star.n, y: shown.y }), url = `${location.origin}${location.pathname}`;
  try {
    const file = new File([await card()], 'chronospherex-star.png', { type: 'image/png' });
    if (navigator.canShare?.({ files: [file] })) return await navigator.share({ files: [file], text: `${text} ${url}` });
    if (navigator.share) return await navigator.share({ text, url });
    const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);          // a desk: the picture is saved
    $('share').textContent = T.saved; setTimeout(() => { $('share').textContent = T.share; }, 2500);
  } catch { /* the visitor closed the sheet */ }
};

}).catch(() => { $('bad').textContent = '…'; });
