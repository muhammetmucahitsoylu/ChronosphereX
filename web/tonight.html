  .row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .row .what { flex: 1; min-width: 0; }
  .row b { display: block; font-weight: 600; font-size: 16px; }
  .row span { display: block; color: var(--ink-2); font-size: 14px; }
  .row .dot { flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--gold); }
  .row.off { opacity: .62; }

  .row.shower { flex-direction: column; align-items: flex-start; gap: 10px; }
  .times { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .times div { text-align: center; }
  .times b { display: block; font: 500 clamp(16px, 5.4vw, 22px)/1.2 var(--mono); white-space: nowrap; }
  .times span { color: var(--ink-2); font-size: 13px; }
  .moon { display: flex; align-items: center; gap: 16px; }
  .moon svg { flex: none; }
  .moon .what { flex: 1; min-width: 0; }
  .moon .what b { display: block; font: 400 24px/1.15 var(--serif); }
  .moon .what span { display: block; color: var(--ink-2); font-size: 14px; }
  #moontimes { white-space: pre-line; }
  button, .btn { font: 600 14px var(--sans); border-radius: 999px; padding: 8px 16px; min-height: 40px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .btn.find { border-color: var(--ember); color: var(--ember); }
  .btn[aria-pressed=true] { border-color: #f2c14e66; color: var(--gold); }
  button.go { background: var(--ember); border-color: var(--ember); color: #1b0b02; min-height: 46px; padding: 11px 20px; font-size: 15px; }
  button:focus-visible, .btn:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  #ask p { margin: 0 0 12px; color: var(--ink-2); }
  .fine { color: var(--ink-3); font-size: 13px; margin-top: 20px; }
  @media (orientation: landscape) and (max-height: 500px) and (min-width: 600px) {
    .wrap { max-width: 900px; }
    h1 { font-size: 30px; margin-top: 10px; }
    #all { columns: 2; column-gap: 16px; }

    showerNames: { gem: 'Gemínidas', urs: 'Úrsidas', qua: 'Cuadrántidas', lyr: 'Líridas', eta: 'Eta Acuáridas', sda: 'Delta Acuáridas del Sur', per: 'Perseidas', ori: 'Oriónidas' } },
};
// The best night of each meteor shower (the evening's date) and the hourly rate under a dark sky where the American
// Meteor Society gives one (amsmeteors.org/calendar and /meteor-showers/major-meteor-showers, read 25 November 2026).
// To be carried on from that calendar once the last of these has passed.
const SHOWERS = [['gem', 2026, 12, 13, '60–70'], ['urs', 2026, 12, 21, '5–10'], ['qua', 2027, 1, 3, '25'], ['lyr', 2027, 4, 21, ''],
  ['eta', 2027, 5, 5, '10–30'], ['sda', 2027, 7, 30, ''], ['per', 2027, 8, 12, '30–50'], ['ori', 2027, 10, 21, '10–20']];
const PLANETS = ['venus', 'jupiter', 'mars', 'saturn', 'mercury'];          // in the order of how bright they usually are

const $ = id => document.getElementById(id), q = new URLSearchParams(location.search);
let lang = q.get('lang');
try { lang = lang || localStorage.getItem('chrono-lang'); } catch { /* private mode */ }
try { if (q.get('lang') && STR[q.get('lang')]) localStorage.setItem('chrono-lang', q.get('lang')); } catch { /* private mode */ }
if (!STR[lang]) lang = (navigator.languages || [navigator.language || 'en']).map(l => l.slice(0, 2).toLowerCase()).find(l => STR[l]) || 'en';
const T = STR[lang], fill = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k]);
document.documentElement.lang = lang; document.title = `${T.title} · ChronosphereX`;
$('lang').value = lang; $('lang').onchange = e => { location.search = `?lang=${e.target.value}`; };
for (const [id, k] of [['title', 'title'], ['lede', 'lede'], ['askwords', 'ask'], ['askbtn', 'askBtn'], ['noplace', 'noPlace'], ['suntitle', 'sun'], ['moontitle', 'moon'], ['planetstitle', 'planets'], ['showerstitle', 'showers'], ['source', 'source'], ['tool', 'tool']]) $(id).textContent = T[k];
$('tool').href = `./?lang=${lang}`; document.querySelector('.logo').href = `./?lang=${lang}`;

const RAD = Math.PI / 180, MIN = 60000, HOUR = 3600000;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clock = new Intl.DateTimeFormat(lang, { hour: 'numeric', minute: '2-digit' }), hm = t => clock.format(new Date(t));          // 17:26, or 5:26 PM where the language counts hours so
const dirOf = az => T.dirs.split(',')[Math.round(az / 45) % 8];
// a phone that can be held up to the sky (the same test as js/point.js): then each thing has a button that finds it there
const canPoint = window.matchMedia('(pointer: coarse)').matches && ('ondeviceorientationabsolute' in window || typeof window.DeviceOrientationEvent?.requestPermission === 'function');
// In the Android app: a reminder on the evening a meteor shower is best, at 21:00 (the app's own notification, which
// opens this page). The app keeps them; this page shows which are set and asks for or drops one with a press.
const app = window.ChronoApp, canRemind = !!app && typeof app.remindAt === 'function';
let reminded = canRemind ? String(app.events() || '').split(',').filter(Boolean) : [];
window.__chronoEvent = (id, on, refused) => { reminded = on ? [...new Set([...reminded, id])] : reminded.filter(k => k !== id); $('evno').hidden = !refused; render(); };
const findLink = name => canPoint ? `<a class="btn find" href="./?point=1&find=${encodeURIComponent(name)}&lang=${lang}">${esc(T.find)}</a>` : '';

/** Height above the horizon and compass bearing of a place in the sky (J2000 degrees) at a moment, from a place on Earth.
 *  The place is first carried to the equator of the date (the Earth's axis has turned 0.36 degrees since 2000: a minute and a half). */
let P = precession(Date.now());
function altAz(ra0, dec0, ms, lat, lon) {
  const x0 = Math.cos(dec0 * RAD) * Math.cos(ra0 * RAD), y0 = Math.cos(dec0 * RAD) * Math.sin(ra0 * RAD), z0 = Math.sin(dec0 * RAD);
  const x = P[0] * x0 + P[1] * y0 + P[2] * z0, y = P[3] * x0 + P[4] * y0 + P[5] * z0, z = P[6] * x0 + P[7] * y0 + P[8] * z0;
  const ra = Math.atan2(y, x) / RAD, dec = Math.asin(Math.max(-1, Math.min(1, z))) / RAD;
  const h = (gmst(ms) + lon - ra) * RAD, d = dec * RAD, f = lat * RAD;
  const alt = Math.asin(Math.sin(d) * Math.sin(f) + Math.cos(d) * Math.cos(f) * Math.cos(h));
  const az = Math.atan2(-Math.cos(d) * Math.sin(h), Math.sin(d) * Math.cos(f) - Math.cos(d) * Math.sin(f) * Math.cos(h));
  return { alt: alt / RAD, az: (az / RAD + 360) % 360 };
}
/** When a height (degrees, a function of time) passes `level` between two moments: [{ t, up }], to a second or so. */
function crossings(height, from, to, level, step = 6 * MIN) {
  const out = []; let a0 = height(from) - level;
  for (let t = from + step; t <= to; t += step) {
    const a = height(t) - level;
    if ((a0 < 0) !== (a < 0)) {
      let lo = t - step, hi = t;
      for (let i = 0; i < 14; i++) { const mid = (lo + hi) / 2; if ((height(mid) - level < 0) === (a0 < 0)) lo = mid; else hi = mid; }
      out.push({ t: (lo + hi) / 2, up: a > 0 });
    }
    a0 = a;
  }
  return out;
}
/** The Moon's lit part as a picture: lit on the right while it grows, as seen from the north; the other way round in the south. */
function moonPicture(lit, growing, south) {
  const r = 48, rx = r * Math.abs(1 - 2 * lit), right = growing !== south;
  const lit_ = `M0,${-r} A${r},${r} 0 0 1 0,${r} A${rx.toFixed(2)},${r} 0 0 ${lit > 0.5 ? 1 : 0} 0,${-r} Z`;
  return `<circle r="${r}" fill="#26221e"/><path d="${lit_}" fill="#efe6d2"${right ? '' : ' transform="scale(-1,1)"'}/><circle r="${r}" fill="none" stroke="#3a342e"/>`;
}
const phaseName = (lit, growing) => T.phases[lit < 0.03 ? 0 : lit > 0.97 ? 4 : lit < 0.42 ? (growing ? 1 : 7) : lit <= 0.58 ? (growing ? 2 : 6) : (growing ? 3 : 5)];

let sky = null;
fetch('data/sky.json').then(r => r.json()).then(d => { sky = d; render(); }).catch(() => null);
let here = null;
try { const k = JSON.parse(localStorage.getItem('chrono-place')); if (k && Number.isFinite(k.lat) && Number.isFinite(k.lon)) here = k; } catch { /* private mode */ }

function render() {
  const now = Date.now(), today = new Date(now);
  P = precession(now);
  $('when').textContent = new Intl.DateTimeFormat(lang, { weekday: 'long', day: 'numeric', month: 'long' }).format(today);
  // ---- the Moon: its phase needs no place; its rising and setting do
  const m = moon(now, here?.lat ?? null, here?.lon ?? null), growing = moon(now + 12 * HOUR).lit > m.lit;
  $('moonpic').innerHTML = moonPicture(m.lit, growing, (here?.lat ?? 40) < 0);
  $('moonphase').textContent = phaseName(m.lit, growing);
  $('moonlit').textContent = fill(T.lit, { p: Math.round(m.lit * 100) });
  // ---- the meteor showers: the next two
  const next = SHOWERS.filter(([, y, mo, d]) => new Date(y, mo - 1, d + 1, 9) > today).slice(0, 2);
  const dm = new Intl.DateTimeFormat(T.dateLoc, { day: 'numeric', month: 'long' });
  $('showerrows').innerHTML = next.map(([id, y, mo, d, rate]) => {
    const lit = moon(new Date(y, mo - 1, d, 23).getTime()).lit;
    const words = [fill(T.peak, { date: `${d}–${dm.format(new Date(y, mo - 1, d + 1))}` }), rate ? fill(T.rate, { r: rate }) : '', fill(T.moonThen, { p: Math.round(lit * 100) })].filter(Boolean);
    const ev = `${id}-${y}`, at = new Date(y, mo - 1, d, 21), on = reminded.includes(ev);
    const when = `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}T21:00`;
    const remind = canRemind && at > today ? `<button type="button" class="btn find" data-ev="${ev}" data-when="${when}" data-name="${esc(T.showerNames[id])}" aria-pressed="${on}">${esc(on ? T.evOn : T.evAsk)}</button>` : '';
    return `<div class="row${remind ? ' shower' : ''}"><div class="what"><b>${esc(T.showerNames[id])}</b>${words.map(w => `<span>${esc(w)}</span>`).join('')}</div>${remind}</div>`;
  }).join('');
  $('showers').hidden = !next.length;
  if (!here) { $('ask').hidden = false; $('sun').hidden = $('planets').hidden = $('stars').hidden = true; $('moontimes').textContent = ''; $('moonfind').hidden = true; return; }
  $('ask').hidden = true;
  const { lat, lon } = here;
  const sunH = t => { const s = planet('sun', t); return altAz(s.ra, s.dec, t, lat, lon).alt; };
  const from = now - 16 * HOUR, to = now + 34 * HOUR;
  const sets = crossings(sunH, from, to, -0.833), civil = crossings(sunH, from, to, -6), naut = crossings(sunH, from, to, -12);
  // Tonight: the night going on now (the Sun down and not yet climbing towards the morning), or else the next one.
  // In the morning's twilight the night is over: tonight is the coming one.
  const h0 = sunH(now), climbing = sunH(now + 10 * MIN) > h0;
  const inNight = h0 < -6 || (h0 < -0.833 && !climbing), darkNow = inNight && h0 < -6;
  const nightStart = inNight ? [...sets].reverse().find(e => !e.up && e.t <= now) : sets.find(e => !e.up && e.t > now);
  const after = nightStart ? nightStart.t : now;
  const rise = sets.find(e => e.up && e.t > Math.max(after, now));
  const dusk = darkNow ? { t: now } : civil.find(e => !e.up && e.t > after - 1), dawn = civil.find(e => e.up && e.t > Math.max(after, now));
  const darkSky = naut.find(e => !e.up && e.t > after - 1);
  $('sun').hidden = false;
  $('suntimes').innerHTML = nightStart || rise
    ? [[T.sunset, nightStart], [T.dark, darkSky], [T.sunrise, rise]].map(([w, e]) => `<div><b>${e ? hm(e.t) : '—'}</b><span>${esc(w)}</span></div>`).join('')
    : `<div style="grid-column:1/-1"><span>${esc(T.noSet)}</span></div>`;
  // ---- the Moon's rising and setting, the next of each
  const moonH = t => { const o = moon(t, lat, lon); return altAz(o.ra, o.dec, t, lat, lon).alt; };
  const mEvents = crossings(moonH, now, now + 30 * HOUR, -0.833, 10 * MIN);
  const mRise = mEvents.find(e => e.up), mSet = mEvents.find(e => !e.up), upNow = moonH(now) > 0;
  // each part on a line of its own, kept whole ("Se pone 9:57", "Untergang 9:57", "Rises 5:50 PM"): the column is narrow,
  // and parts joined by dots broke apart, leaving a dot alone on a line in German
  $('moontimes').textContent = [upNow ? T.upNow : '', mRise ? fill(T.rises, { t: hm(mRise.t) }) : '', mSet ? fill(T.sets, { t: hm(mSet.t) }) : ''].filter(Boolean).map(s => s.replace(/ /g, ' ')).join('\n');
  $('moonfind').outerHTML = findLink(T.names.moon).replace('class="btn find"', 'class="btn find" id="moonfind"') || '<a id="moonfind" hidden></a>';
  // ---- the planets: seen while the Sun is 6 degrees or more below the horizon, and the planet 5 degrees or more above it
  const win = dusk && dawn && dawn.t > dusk.t ? { from: dusk.t, to: dawn.t } : null;
  $('planets').hidden = !win;
  if (win) {
    const rows = PLANETS.map(id => {
      let best = null, first = null, last = null;
      for (let t = win.from, last_ = false; !last_; t = Math.min(t + 10 * MIN, win.to)) {          // every ten minutes, and the night's very end (a planet rising before dawn is best then)
        last_ = t >= win.to;
        const p = planet(id, t), a = altAz(p.ra, p.dec, t, lat, lon);
        if (a.alt > 5) { first ??= t; last = t; if (!best || a.alt > best.alt) best = { t, ...a }; }
      }
      const name = T.names[id];
      if (!best) {
        const p = planet(id, win.from), s = planet('sun', win.from);
        const apart = Math.acos(Math.sin(p.dec * RAD) * Math.sin(s.dec * RAD) + Math.cos(p.dec * RAD) * Math.cos(s.dec * RAD) * Math.cos((p.ra - s.ra) * RAD)) / RAD;
        return { up: false, html: `<div class="row off"><i class="dot" style="background:var(--ink-3)"></i><div class="what"><b>${esc(name)}</b><span>${esc(fill(T.notTonight, { why: apart < 25 ? T.nearSun : T.down }))}</span></div></div>` };
      }
      const words = [fill(T.best, { t: hm(best.t), dir: dirOf(best.az), alt: Math.round(best.alt) }), fill(T.span, { a: hm(first), b: hm(last) })];
      return { up: true, html: `<div class="row"><i class="dot"></i><div class="what"><b>${esc(name)}</b>${words.map(w => `<span>${esc(w)}</span>`).join('')}</div>${findLink(name)}</div>` };
    });
    $('planetrows').innerHTML = [...rows.filter(r => r.up), ...rows.filter(r => !r.up)].map(r => r.html).join('');
  }
  // ---- the brightest named stars above 15 degrees: now if it is dark, otherwise half an hour into the dark
  if (sky) {
    const at = darkNow && h0 < -12 ? now : darkSky ? Math.max(darkSky.t + 30 * MIN, now) : null;
    $('stars').hidden = !at;
    if (at) {
      $('starstitle').textContent = at === now ? T.stars : fill(T.starsAt, { t: hm(at) });
      const list = sky.stars.map(([name, ra, dec, v]) => ({ name, v, ...altAz(ra, dec, at, lat, lon) })).filter(s => s.alt > 15).sort((a, b) => a.v - b.v).slice(0, 8);
      $('starrows').innerHTML = list.map(s => `<div class="row"><i class="dot" style="background:var(--ink)"></i><div class="what"><b>${esc(s.name)}</b><span>${esc(fill(T.up, { dir: dirOf(s.az), alt: Math.round(s.alt) }))}</span></div>${findLink(s.name)}</div>`).join('');
    }
  }
}
render();
$('evno').textContent = T.evNo;
$('showerrows').addEventListener('click', e => {
  const b = e.target.closest('button[data-ev]');
  if (!b || !canRemind) return;
  if (b.getAttribute('aria-pressed') === 'true') app.remindAt(b.dataset.ev, '', '', '');
  else app.remindAt(b.dataset.ev, b.dataset.when, fill(T.evTitle, { name: b.dataset.name }), T.evText);
});
$('askbtn').onclick = async () => {
  $('askbtn').disabled = true;
  const p = await place().catch(() => null);
  $('askbtn').disabled = false;
  if (p) { here = p; render(); } else $('noplace').hidden = false;
};
if (here) place().then(p => { if (p && (p.lat !== here.lat || p.lon !== here.lon)) { here = p; render(); } }).catch(() => null);          // the kept place, looked up again behind the scenes
setInterval(render, 5 * MIN);          // the times move on, and the night with them
</script>
</body>
</html>
