<style>
  :root { --bg: #0a0d13; --surface: #121722; --line: #283246; --ink: #eef2f7; --ink-2: #a8b3c3; --ink-3: #7f8a9c; --ember: #ff7b39; --mint: #5fe0b0; --gold: #f2c14e; --red: #ff6b5e;
    --h2o: #4cc9f0; --ch4: #ff7b39; --co2: #c9a0ff; --co: #f2c14e;
    --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif; --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace; color-scheme: dark; }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); -webkit-text-size-adjust: 100%; }
  a { color: inherit; }
  [hidden] { display: none !important; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 14px 16px 40px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .logo { font: 26px/1 var(--serif); font-style: italic; text-decoration: none; display: inline-flex; align-items: center; gap: 9px; }
  .logo i { width: 15px; height: 15px; border-radius: 50%; background: var(--ember); display: inline-block; }
  select { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; font: 14px var(--sans); }
  h1 { font: 400 36px/1.08 var(--serif); margin: 18px 0 4px; }
  .lede { color: var(--ink-2); margin: 0 0 12px; font-size: 15px; }
  .bar { display: flex; align-items: center; gap: 10px; font: 500 12.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ember); margin: 4px 0 6px; }
  .bar .grow { flex: 1; }
  .bar .book { color: var(--mint); letter-spacing: .06em; }
  .dots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin: 0 0 10px; }
  .dots i { height: 4px; border-radius: 2px; background: var(--line); }
  .dots i.on { background: var(--ember); } .dots i.done { background: var(--mint); }
  .fpcard { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); margin-bottom: 10px; }
  .fpcard svg { flex: none; }
  .fpcard b { display: block; font: 400 22px/1.1 var(--serif); }
  .fpcard span { color: var(--ink-2); font-size: 14px; }
  h2 { font: 400 28px/1.1 var(--serif); margin: 6px 0 2px; }
  .look { color: var(--ink-2); font-size: 14.5px; margin: 0 0 8px; }
  figure { margin: 0; padding: 10px 8px 6px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
  figure svg { display: block; width: 100%; height: auto; }
  figcaption { font-size: 12.5px; color: var(--ink-3); padding: 2px 4px 0; }
  .chips { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
  .chip { min-height: 60px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font: 600 15px var(--sans); padding: 4px 2px; cursor: pointer; }
  .chip small { font: 400 10.5px/1.15 var(--sans); color: var(--ink-2); text-align: center; max-width: 100%; overflow-wrap: anywhere; hyphens: auto; }          /* 'karbonmonoksit' on two lines in a narrow chip */
  .chip { min-width: 0; overflow: hidden; }
  .chip[aria-pressed=true] { border-width: 2.5px; background: #ffffff10; }
  .chip:disabled { opacity: .45; cursor: default; }
  .chip.right { border-color: var(--mint) !important; background: #0f2a22; }
  .chip.wrong { border-color: var(--red) !important; background: #2a1210; }
  .btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; scroll-margin-bottom: calc(var(--tabs, 0px) + 14px); }
  .btns > * { flex: 1 1 140px; }
  button, .btn { font: 600 16px var(--sans); border-radius: 999px; padding: 12px 18px; min-height: 52px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; text-align: center; }
  button.go, .btn.go { background: var(--ember); border-color: var(--ember); color: #1b0b02; }
  button:disabled.go { opacity: .5; }
  button:focus-visible, .btn:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .say { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 15px; }
  .say li { display: flex; gap: 8px; align-items: baseline; }
  .say li::before { content: '●'; font-size: 11px; color: var(--ink-3); }
  .say li.ok::before { content: '✓'; color: var(--mint); font-size: 15px; font-weight: 700; }
  .say li.no::before { content: '✗'; color: var(--red); font-size: 15px; font-weight: 700; }
  .kinds { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
  .kinds button { min-height: 76px; border-radius: 14px; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; text-align: left; padding: 10px 12px; }
  .kinds button small { font: 400 12.5px/1.3 var(--sans); color: var(--ink-2); }
  .kinds button.right { border-color: var(--mint); background: #0f2a22; }
  .kinds button.wrong { border-color: var(--red); background: #2a1210; }
  #ask:focus, #reveal:focus { outline: none; }          /* focused by the game for screen readers, not by a hand */
  .reveal { margin-top: 12px; padding: 14px; border-radius: 16px; background: #0f2a22; border: 1px solid #5fe0b066; display: grid; gap: 4px; }
  .reveal .k { font: 500 12px var(--mono); letter-spacing: .14em; color: var(--mint); text-transform: uppercase; }
  .reveal b { font: 400 30px/1.05 var(--serif); }
  .reveal span { color: #d4dbe5; font-size: 15px; }
  .reveal small { color: var(--ink-2); font-size: 13.5px; }
  .fine { color: var(--ink-3); font-size: 13px; margin-top: 22px; }
  .fine button { min-height: 0; padding: 0; border: 0; background: none; color: var(--ink-2); font: 500 13px var(--sans); text-decoration: underline; }
  details.more { margin-top: 10px; color: var(--ink-2); font-size: 13.5px; }
  details.more summary { cursor: pointer; }
</style>

  <main>
    <h1 id="title"></h1>

    <div class="btns" id="checkrow" hidden><button type="button" class="go" id="check" disabled></button></div>
    <ul class="say" id="say" aria-live="polite"></ul>
    <div id="kindbox" hidden><h2 id="kindask"></h2><div class="kinds" id="kinds"></div></div>
    <div class="reveal" id="reveal" tabindex="-1" hidden></div>
    <div class="btns" id="nextrow" hidden><a class="btn" id="open" href="./"></a><button type="button" class="go" id="next"></button></div>
    <details class="more" id="more"><summary id="moresum"></summary><p id="moretext"></p></details>
    <p class="fine"><span id="credit"></span> <button type="button" id="again"></button></p>
  </main>
</div>

      iceyoung: 'Una estrella joven tras una nube fría de polvo y hielo.', young: 'Una estrella joven, aún en la nube donde nació.', sunlike: 'Una estrella como el Sol.',

const $ = id => document.getElementById(id), q = new URLSearchParams(location.search);
let lang = q.get('lang');
try { lang = lang || localStorage.getItem('chrono-lang'); } catch { /* private mode */ }
if (!STR[lang]) lang = (navigator.languages || [navigator.language || 'en']).map(l => l.slice(0, 2).toLowerCase()).find(l => STR[l]) || 'en';
const T = STR[lang], fill = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k]);
document.documentElement.lang = lang; $('lang').value = lang;
$('lang').onchange = () => { try { localStorage.setItem('chrono-lang', $('lang').value); } catch { /* private mode */ } q.set('lang', $('lang').value); location.search = q.toString(); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const SUBS = ['h2o', 'ch4', 'co2', 'co'], F = { h2o: 'H₂O', ch4: 'CH₄', co2: 'CO₂', co: 'CO' };
const COL = { h2o: '#4cc9f0', ch4: '#ff7b39', co2: '#c9a0ff', co: '#f2c14e' };
const store = (k, v) => { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || 'null'); localStorage.setItem(k, JSON.stringify(v)); } catch { return null; } };
const book = new Set(store('chrono-fp-book') || []);          // what has been worked out, on this device
let POOL = [], obj = null, spec = null, step = -1, n = store('chrono-fp-n') || 0, picks = new Set(), phase = 'ask';
for (const [id, k] of [['title', 'title'], ['lede', 'lede'], ['again', 'again'], ['credit', 'credit'], ['moresum', 'moreSum'], ['moretext', 'moreText'], ['cap', 'cap']]) $(id).textContent = T[k];
document.title = `${T.title} · ChronosphereX`;

/** Which of the four kinds the traces alone tell: methane → very cold; water without methane → a cool dwarf; ice → behind a cloud; none at all → hotter. */
function kindOf(o) {
  const a = o.ans;
  if (o.kind === 'iceyoung') return 'ice';
  if (a.ch4 === 'y') return 'cold';
  if (a.h2o === 'y' && a.ch4 === 'n') return 'cool';
  if (SUBS.every(k => a[k] !== 'y') && SUBS.filter(k => a[k] === 'n').length >= 3) return 'hot';
  return null;          // not told apart by its traces alone: the question is not asked
}
function draw(only, result) {
  const W = 340, H = 150, x = w => 6 + (w - 0.75) / (5.0 - 0.75) * (W - 12), s = spec.spec;
  // brightness on a log scale: a brown dwarf is a hundred times brighter at 4 microns than at 1, and on a straight scale
  // its water dips near 1.4 microns would lie flat along the bottom where no one sees them
  const lg = v => Math.log10(Math.max(v, 1e-3)), vs = s.map(p => lg(p[1])), lo = Math.min(...vs), hi = Math.max(...vs), span = Math.max(hi - lo, 0.3);
  const y = v => 8 + (1 - (lg(v) - lo) / span) * (H - 16);
  let g = '';
  for (const b of spec.bands) {
    if (only && b.chip !== only) continue;
    if (!only && obj.ans[b.chip] === '?') { g += `<rect x="${x(b.band[0]).toFixed(1)}" y="0" width="${(x(b.band[1]) - x(b.band[0])).toFixed(1)}" height="${H}" fill="#7f8a9c" fill-opacity=".10"/>`; continue; }
    const c = COL[b.chip], shown = result && b.state === 'dip';
    g += `<rect x="${x(b.band[0]).toFixed(1)}" y="0" width="${Math.max(3, x(b.band[1]) - x(b.band[0])).toFixed(1)}" height="${H}" fill="${c}" fill-opacity="${shown ? 0.34 : 0.16}"/>`;
    if (result && b.state === 'dip' && b.depth) g += `<text x="${((x(b.band[0]) + x(b.band[1])) / 2).toFixed(1)}" y="12" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" fill="${c}">${Math.round(b.depth * 100)}%</text>`;
  }
  const path = s.map((p, i) => `${i ? 'L' : 'M'}${x(p[0]).toFixed(1)} ${y(p[1]).toFixed(1)}`).join(' ');
  g += `<path d="${path}" fill="none" stroke="#eef2f7" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
  g += [1, 2, 3, 4, 5].map(v => `<text x="${x(v).toFixed(1)}" y="${H + 20}" text-anchor="${v === 5 ? 'end' : 'middle'}" font-family="IBM Plex Mono, monospace" font-size="11" fill="#7f8a9c">${v}${v === 5 ? ' µm' : ''}</text>`).join('');
  $('spec').innerHTML = g;
  $('spec').setAttribute('aria-label', T.cap);
}
function fpCard(k) {
  const c = COL[k];
  $('fpcard').innerHTML = `<svg aria-hidden="true" width="60" height="38" viewBox="0 0 60 38" fill="none" stroke="${c}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9h18l5 22 5-22h28"/></svg><div><b>${esc(T.fp[k][0])}</b><span>${esc(T.fp[k][1])}</span></div>`;
  $('fpcard').style.borderColor = `${c}66`; $('fpcard').hidden = false;
}
function bar() {
  $('where').textContent = step >= 0 ? `${T.guide} · ${step + 1} / 3` : fill(T.mystery, { n: n + 1 });
  $('dots').hidden = step < 0;
  [...$('dots').children].forEach((d, i) => { d.className = i < step ? 'done' : i === step ? 'on' : ''; });
  $('book').textContent = book.size ? fill(T.book, { n: book.size }) : '';
}
const pick = list => list[Math.floor(Math.random() * list.length)];
/** The guide's objects: a T dwarf for water; for methane, one without it (water but no methane) so that No is the answer once. */
function choose() {
  const fresh = o => !book.has(o.id);
  if (step === 0) return pick(POOL.filter(o => o.ans.h2o === 'y' && o.kind === 'browndwarf')) || pick(POOL.filter(o => o.ans.h2o === 'y'));
  if (step === 1) return pick(POOL.filter(o => o.ans.ch4 === 'n' && o.ans.h2o === 'y')) || pick(POOL.filter(o => o.ans.ch4 !== '?'));
  // at random, but each kind as often as another, so that the answer is not always the same
  const kinds = [...new Set(POOL.map(o => o.kind))], k = pick(kinds);
  return pick(POOL.filter(o => o.kind === k && fresh(o))) || pick(POOL.filter(o => o.kind === k)) || pick(POOL);
}
async function load(o, focus = false) {
  obj = o; spec = null; picks = new Set(); phase = 'ask';
  for (const id of ['say', 'kinds']) $(id).innerHTML = '';
  for (const id of ['kindbox', 'reveal', 'nextrow', 'yesno', 'checkrow', 'chips', 'fpcard']) $(id).hidden = true;
  $('ask').textContent = T.loading; $('look').textContent = '';
  try { spec = await (await fetch(`game/fp/${o.file}`)).json(); } catch { $('ask').textContent = T.failed; return; }
  bar();
  if (step === 0 || step === 1) {
    const k = step === 0 ? 'h2o' : 'ch4';
    fpCard(k); $('ask').textContent = T[`q${k}`]; $('look').textContent = T.lookOne;
    $('yes').textContent = T.yes; $('no').textContent = T.no; $('yesno').hidden = false;
    $('yes').onclick = () => answerOne(k, true); $('no').onclick = () => answerOne(k, false);
    draw(k, false);
  } else {
    $('ask').textContent = T.qall; $('look').textContent = T.lookAll;
    chips(); $('check').textContent = T.check; $('check').disabled = true; $('checkrow').hidden = false; $('check').onclick = checkAll;
    draw(null, false);
  }
  if (focus) $('ask').focus({ preventScroll: true });          // the button that was pressed has gone: the new question is where the reader goes on
}
function chips() {
  const el = $('chips'); el.hidden = false;
  el.innerHTML = SUBS.map(k => {
    const a = obj.ans[k], off = a === '?';
    return `<button type="button" class="chip" data-k="${k}" aria-pressed="false" style="border-color:${COL[k]}66"${off ? ' disabled' : ''}>${F[k]}<small>${esc(off ? T.unmeasured : T.names[k])}</small></button>`;
  }).join('') + `<button type="button" class="chip" data-k="none" aria-pressed="false">${esc(T.none)}<small>–</small></button>`;
  el.querySelectorAll('.chip').forEach(b => { b.onclick = () => {
    if (phase !== 'ask') return;
    const k = b.dataset.k;
    if (k === 'none') picks = picks.has('none') ? new Set() : new Set(['none']);
    else { picks.delete('none'); picks.has(k) ? picks.delete(k) : picks.add(k); }
    el.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(picks.has(c.dataset.k))));
    $('check').disabled = !picks.size;
  }; });
}
function lines() {
  // what each band says, one line a substance, deepest dip first
  const out = [];
  for (const k of SUBS) {
    const a = obj.ans[k], name = T.names[k].replace(/^./, c => c.toLocaleUpperCase(lang));
    if (a === 'y') { const d = Math.max(...spec.bands.filter(b => b.chip === k && b.state === 'dip').map(b => b.depth || 0)); out.push(fill(T.dip, { name, p: Math.round(d * 100) })); }
    else if (a === 'n') out.push(fill(T.flat, { name }));
    else out.push(fill(T.grey, { name }));
  }
  return out;
}
function answerOne(k, said) {
  if (phase !== 'ask') return; phase = 'done';
  const truth = obj.ans[k] === 'y', ok = said === truth;
  $('yesno').hidden = true; draw(k, true);
  const name = T.names[k].replace(/^./, c => c.toLocaleUpperCase(lang));
  const d = truth ? Math.max(...spec.bands.filter(b => b.chip === k && b.state === 'dip').map(b => b.depth || 0)) : 0;
  $('say').innerHTML = `<li class="${ok ? 'ok' : 'no'}">${esc(ok ? T.right : T.wrong)} ${esc(truth ? fill(T.dip, { name, p: Math.round(d * 100) }) : fill(T.flat, { name }))}</li>`;
  $('next').textContent = T.guideNext; $('next').onclick = () => { step++; load(choose(), true); };
  $('open').hidden = true; $('nextrow').hidden = false;
  $('next').focus({ preventScroll: true });
  $('nextrow').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function checkAll() {
  if (phase !== 'ask') return; phase = 'checked';
  $('checkrow').hidden = true; draw(null, true);
  let good = 0, all = 0;
  $('chips').querySelectorAll('.chip').forEach(c => {
    const k = c.dataset.k;
    if (k === 'none') { const truth = SUBS.every(s => obj.ans[s] !== 'y'); if (picks.has('none') || truth) c.classList.add(picks.has('none') === truth ? 'right' : 'wrong'); return; }
    if (obj.ans[k] === '?') return;
    const truth = obj.ans[k] === 'y', said = picks.has(k); all++; if (said === truth) good++;
    if (said || truth) c.classList.add(said === truth ? 'right' : 'wrong');
  });
  const L = lines();
  $('say').innerHTML = `<li class="${good === all ? 'ok' : 'no'}">${esc(good === all ? T.right : T.wrong)} ${good} / ${all}</li>` + L.map(l => `<li>${esc(l)}</li>`).join('');
  const kind = kindOf(obj);
  if (!kind) return reveal(null);
  $('kindask').textContent = T.kindAsk; $('kindbox').hidden = false;
  $('kinds').innerHTML = ['cold', 'cool', 'ice', 'hot'].map(k => `<button type="button" data-k="${k}"><b>${esc(T.kinds[k][0])}</b><small>${esc(T.kinds[k][1])}</small></button>`).join('');
  $('kinds').querySelectorAll('button').forEach(b => { b.onclick = () => {
    if (phase !== 'checked') return; phase = 'kind';
    const ok = b.dataset.k === kind;
    b.classList.add(ok ? 'right' : 'wrong'); if (!ok) $('kinds').querySelector(`[data-k="${kind}"]`).classList.add('right');
    reveal(ok && good === all);
  }; });
  $('kinds').querySelector('button').focus({ preventScroll: true });
  $('kindbox').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function reveal(won) {
  const o = obj, what = o.kind === 'browndwarf' && /^L/.test(o.sp) ? 'cooldwarf' : o.kind;
  book.add(o.id); store('chrono-fp-book', [...book]);
  if (step < 0) { n++; store('chrono-fp-n', n); }
  $('reveal').innerHTML = `<span class="k">${esc(won ? T.solved : T.solvedNot)}</span><b>${esc(o.name)}</b><span>${esc(T.what[what] || '')}</span>`
    + `<small>${[o.sp, o.ly ? fill(T.far, { ly: String(o.ly).replace('.', T.dec) }) : ''].filter(Boolean).map(esc).join(' · ')}</small>`;
  $('reveal').hidden = false; bar();
  const pm = o.pm ? `&star=${o.ra},${o.dec},${o.pm[0]},${o.pm[1]},${o.plx || 0}&name=${encodeURIComponent(o.name)}` : '';
  $('open').href = `./?ra=${o.at ? o.at[0] : o.ra}&dec=${o.at ? o.at[1] : o.dec}&fov=5${pm}&lang=${lang}`; $('open').textContent = T.open; $('open').hidden = false;
  if (step === 2) { $('next').textContent = T.next; $('next').onclick = () => { step = -1; store('chrono-fp-guided', 1); load(choose(), true); }; $('say').insertAdjacentHTML('beforeend', `<li class="ok">${esc(T.guideDone)}</li>`); }
  else { $('next').textContent = T.next; $('next').onclick = () => load(choose(), true); }
  $('nextrow').hidden = false; $('reveal').focus({ preventScroll: true });
  requestAnimationFrame(() => $('nextrow').scrollIntoView({ block: 'nearest', behavior: 'smooth' }));
}
$('again').onclick = () => { step = 0; load(choose(), true); scrollTo({ top: 0, behavior: 'smooth' }); };
fetch('game/fp/pool.json').then(r => r.json()).then(d => {
  POOL = d.objects || [];
  if (!POOL.length) throw new Error('empty');
  step = store('chrono-fp-guided') && !q.has('guide') ? -1 : 0;
  load(choose());
}).catch(() => { $('ask').textContent = T.failed; });
</script>
