<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- inside the Android app: the edges of the glass and the app's bar of places (does nothing in a browser) -->
<script src="js/tabs.js"></script>
<meta name="theme-color" content="#0a0d13">
<script src="js/look.js"></script>
<title>Picture studio · ChronosphereX</title>
<meta name="description" content="Make your own infrared picture of any patch of sky from NASA’s SPHEREx data: choose a frame on the map, pick gas and dust, stars, or three wavelengths side by side, adjust it and save or share it. For beginners and for people who process astronomical images.">
<link rel="canonical" href="https://chronospherex.com/studio.html">
<meta property="og:title" content="Picture studio · ChronosphereX">
<meta property="og:description" content="Make your own infrared picture of any patch of sky from NASA’s SPHEREx data.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://chronospherex.com/studio.html">
<meta property="og:image" content="https://chronospherex.com/img/studio-share.jpg">
<meta property="og:site_name" content="ChronosphereX">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://nasa-irsa-spherex.s3.amazonaws.com" crossorigin>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/studio.css">
<link rel="stylesheet" href="css/icons.css">
<script data-goatcounter="https://chronospherex.goatcounter.com/count" async src="/js/count.js"></script>
</head>
<body class="place">
<header class="top">
  <a class="logo" id="logo" href="./"><i></i>ChronosphereX</a>
  <span class="ttl" id="ttl">Picture studio</span>
  <span class="grow"></span>
  <div class="seg" id="mode" role="group" aria-label="How much to show"><button type="button" data-m="basic" aria-pressed="true">Simple</button><button type="button" data-m="pro" aria-pressed="false">Pro</button></div>
  <!-- the guide that makes a picture with the visitor, step by step; and the settings (the language is in there) -->
  <button type="button" class="topbtn" id="guidebtn"><svg viewBox="0 0 256 256" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M232,56V200H160a32,32,0,0,0-32,32,32,32,0,0,0-32-32H24V56H96a32,32,0,0,1,32,32,32,32,0,0,1,32-32Z" fill="#ff7b39" opacity="0.45"/><path d="M232,48H160a40,40,0,0,0-32,16A40,40,0,0,0,96,48H24a8,8,0,0,0-8,8V200a8,8,0,0,0,8,8H96a24,24,0,0,1,24,24,8,8,0,0,0,16,0,24,24,0,0,1,24-24h72a8,8,0,0,0,8-8V56A8,8,0,0,0,232,48ZM96,192H32V64H96a24,24,0,0,1,24,24V200A39.81,39.81,0,0,0,96,192Zm128,0H160a39.81,39.81,0,0,0-24,8V88a24,24,0,0,1,24-24h64Z"/></svg><span id="guideword">Guide</span></button>
  <button type="button" class="topbtn icon" id="setbtn" aria-label="Settings"><svg viewBox="0 0 256 256" width="21" height="21" fill="currentColor" aria-hidden="true"><path d="M230.1,108.76,198.25,90.62c-.64-1.16-1.31-2.29-2-3.41l-.12-36A104.61,104.61,0,0,0,162,32L130,49.89c-1.34,0-2.69,0-4,0L94,32A104.58,104.58,0,0,0,59.89,51.25l-.16,36c-.7,1.12-1.37,2.26-2,3.41l-31.84,18.1a99.15,99.15,0,0,0,0,38.46l31.85,18.14c.64,1.16,1.31,2.29,2,3.41l.12,36A104.61,104.61,0,0,0,94,224l32-17.87c1.34,0,2.69,0,4,0L162,224a104.58,104.58,0,0,0,34.08-19.25l.16-36c.7-1.12,1.37-2.26,2-3.41l31.84-18.1A99.15,99.15,0,0,0,230.1,108.76ZM128,168a40,40,0,1,1,40-40A40,40,0,0,1,128,168Z" fill="#ff7b39" opacity="0.45"/><path d="M128,80a48,48,0,1,0,48,48A48.05,48.05,0,0,0,128,80Zm0,80a32,32,0,1,1,32-32A32,32,0,0,1,128,160Zm109.94-52.79a8,8,0,0,0-3.89-5.4l-29.83-17-.12-33.62a8,8,0,0,0-2.83-6.08,111.91,111.91,0,0,0-36.72-20.67,8,8,0,0,0-6.46.59L128,41.85,97.88,25a8,8,0,0,0-6.47-.6A111.92,111.92,0,0,0,54.73,45.15a8,8,0,0,0-2.83,6.07l-.15,33.65-29.83,17a8,8,0,0,0-3.89,5.4,106.47,106.47,0,0,0,0,41.56,8,8,0,0,0,3.89,5.4l29.83,17,.12,33.63a8,8,0,0,0,2.83,6.08,111.91,111.91,0,0,0,36.72,20.67,8,8,0,0,0,6.46-.59L128,214.15,158.12,231a7.91,7.91,0,0,0,3.9,1,8.09,8.09,0,0,0,2.57-.42,112.1,112.1,0,0,0,36.68-20.73,8,8,0,0,0,2.83-6.07l.15-33.65,29.83-17a8,8,0,0,0,3.89-5.4A106.47,106.47,0,0,0,237.94,107.21Zm-15,34.91-28.57,16.25a8,8,0,0,0-3,3c-.58,1-1.19,2.06-1.81,3.06a7.94,7.94,0,0,0-1.22,4.21l-.15,32.25a95.89,95.89,0,0,1-25.37,14.3L134,199.13a8,8,0,0,0-3.91-1h-.19c-1.21,0-2.43,0-3.64,0a8.1,8.1,0,0,0-4.1,1l-28.84,16.1A96,96,0,0,1,67.88,201l-.11-32.2a8,8,0,0,0-1.22-4.22c-.62-1-1.23-2-1.8-3.06a8.09,8.09,0,0,0-3-3.06l-28.6-16.29a90.49,90.49,0,0,1,0-28.26L61.67,97.63a8,8,0,0,0,3-3c.58-1,1.19-2.06,1.81-3.06a7.94,7.94,0,0,0,1.22-4.21l.15-32.25a95.89,95.89,0,0,1,25.37-14.3L122,56.87a8,8,0,0,0,4.1,1c1.21,0,2.43,0,3.64,0a8,8,0,0,0,4.1-1l28.84-16.1A96,96,0,0,1,188.12,55l.11,32.2a8,8,0,0,0,1.22,4.22c.62,1,1.23,2,1.8,3.06a8.09,8.09,0,0,0,3,3.06l28.6,16.29A90.49,90.49,0,0,1,222.9,142.12Z"/></svg></button>
</header>

<main id="app">
  <section id="stage" aria-label="Picture">
    <!-- step one: the sky, and a frame that stays put while the sky is dragged under it -->
    <div id="picker">
      <div id="map"></div>
      <div id="frame"><span id="framesize"></span><b class="fgrip" data-c="nw"></b><b class="fgrip" data-c="ne"></b><b class="fgrip" data-c="se"></b><b class="fgrip" data-c="sw"></b></div>
      <form id="find" role="search"><input id="q" type="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false"><button type="submit" id="go">Go</button></form>
      <p id="findmsg" role="status"></p>
      <div class="zoom"><button type="button" id="zin" aria-label="Zoom in">+</button><button type="button" id="zout" aria-label="Zoom out">−</button></div>
    </div>
    <!-- step two: the picture -->
    <div id="easel" hidden>
      <div id="scroll"><div id="sheet"><canvas id="pic"></canvas><canvas id="marks" aria-hidden="true"></canvas>
        <!-- crop: a frame with handles over the picture, turned and mirrored as it will be saved (js/studio/view.js) -->
        <div id="cropper" hidden><div id="cbox"><i class="gv1"></i><i class="gv2"></i><i class="gh1"></i><i class="gh2"></i><b data-h="nw"></b><b data-h="n"></b><b data-h="ne"></b><b data-h="e"></b><b data-h="se"></b><b data-h="s"></b><b data-h="sw"></b><b data-h="w"></b></div></div>
      </div></div>
      <div id="busy" hidden role="status"><b id="busysay"></b><span id="busysub"></span><div class="bar"><i id="busybar"></i></div><button type="button" id="stop">Stop</button></div>
      <!-- under the picture, never on it: what is written on a picture (title, key, compass) must stay in sight -->
      <div class="easelbar"><button type="button" id="tobox" class="ic ic-download chip">Take it with you</button>
        <span class="tools"><button type="button" id="undo" class="chip icon" disabled><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 7H4v5M4.6 11.5A8 8 0 1 1 7 17.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button type="button" id="redo" class="chip icon" disabled><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 7h5v5M19.4 11.5A8 8 0 1 0 17 17.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button type="button" id="cropbtn" class="chip"><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M6 2v14a2 2 0 0 0 2 2h14M2 6h14a2 2 0 0 1 2 2v14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="cropword">Crop</span></button><button type="button" id="cmpbtn" class="chip icon"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg></button></span>
        <button type="button" id="fullbtn" class="ic ic-maximize chip" aria-pressed="false">Full size</button></div>
    </div>
  </section>

  <aside id="side">
    <!-- step one's words -->
    <div id="sideplace">
      <h1 id="placetitle">Choose a patch of sky</h1>
      <p class="lede" id="placehelp"></p>
      <p class="linkopens" id="linkopens" hidden></p>
      <!-- Pro: the frame by numbers, the first thing under the title so that pressing "Pro" shows at once what it adds
           here. Hidden in Simple (studio.css, by the mode written on <body>). -->
      <section class="proonly" id="proplace">
        <h2 id="h_proframe">The frame in numbers</h2>
        <div class="nums">
          <label><span id="l_ra">Right ascension (°)</span><input type="text" inputmode="decimal" id="n_ra" autocomplete="off" spellcheck="false"></label>
          <label><span id="l_dec">Declination (°)</span><input type="text" id="n_dec" autocomplete="off" spellcheck="false" autocapitalize="off"></label>
          <label><span id="l_w">Width (°)</span><input type="text" inputmode="decimal" id="n_w" autocomplete="off" spellcheck="false"></label>
          <label><span id="l_h">Height (°)</span><input type="text" inputmode="decimal" id="n_h" autocomplete="off" spellcheck="false"></label>
          <label><span id="l_pa">Position angle (°)</span><input type="text" id="n_pa" autocomplete="off" spellcheck="false" autocapitalize="off"></label>
        </div>
        <p class="fine hms" id="prohms"></p>
        <p class="fine" id="prosays" role="status"></p>
        <p class="fine" id="prohint"></p>
      </section>
      <h2 id="h_places">Good places to start</h2>
      <div class="chips" id="places"></div>
      <h2 id="h_shape">Shape of the frame</h2>
      <div class="seg wrap" id="shape" role="group"></div>
      <div class="row2">
        <label><span id="l_turn">Which way is up</span><select id="turn"></select></label>
        <label><span id="l_map">Map shown</span><select id="maplayer"></select></label>
      </div>
      <p class="fine" id="mapnote" hidden></p>
      <p class="says" id="framesays" role="status"></p>
      <p class="fine" id="framehint"></p>
      <h2 id="h_quality">Quality</h2>
      <div class="seg" id="quality" role="group"></div>
      <p class="fine" id="qsay"></p>
      <p class="fine" id="qall"></p>
      <h2 id="h_kind">What kind of picture</h2>
      <div class="cards" id="kind" role="radiogroup"></div>
      <!-- Pro's fourth kind, "your own wavelengths": the 102 of them to press -->
      <div id="ownbox" hidden></div>
      <!-- what it costs and the button that starts it stay in sight however far the choices above are scrolled -->
      <div class="act" id="act">
        <p class="says" id="cost" role="status"></p>
        <button type="button" class="ic ic-image-dark cta" id="get">Get the picture</button>
      </div>
    </div>

    <!-- step two's controls -->
    <div id="sidestudio" hidden>
      <!-- crop, turn, mirror: shown instead of the other controls while the frame is on the picture -->
      <section id="cropbox" hidden>
        <h2 id="h_crop">Crop</h2>
        <div class="seg wrap" id="aspects" role="group"></div>
        <div class="rowbtns croptools"><button type="button" class="ghost" id="turnbtn"><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M20 11a8 8 0 1 1-2.3-5.6M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="turnword">Rotate</span></button><button type="button" class="ghost" id="flipbtn"><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M12 3v18M9 7 4 17h5zM15 7l5 10h-5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span id="flipword">Flip</span></button><button type="button" class="ghost" id="cropreset">Reset</button></div>
        <p class="says" id="cropsays" role="status"></p>
        <p class="fine" id="crophint"></p>
        <div class="rowbtns big"><button type="button" class="ghost" id="cropcancel">Cancel</button><button type="button" class="cta" id="cropapply">Apply</button></div>
      </section>
      <div class="rowbtns"><button type="button" class="ic ic-pin ghost" id="another">Another place</button><a class="ic ic-sky ghost" id="openmap" href="./">Open this place on the sky map</a></div>
      <div id="notes"></div>
      <h2 id="h_kind2">What kind of picture</h2>
      <div class="seg wrap" id="kind2" role="group"></div>
      <div class="seg" id="quality2" role="group"></div>
      <div class="need" id="need" hidden><span id="needsay"></span><button type="button" id="neednow">Read them</button></div>

      <section id="basicbox">
        <h2 id="h_edit">Adjust</h2>
        <div id="basic"></div>
        <button type="button" class="ghost small" id="reset">Back to the recipe</button>
      </section>

      <section id="probox" hidden>
        <h2 id="h_layers">Layers</h2>
        <div id="layers"></div>
        <div class="rowbtns"><button type="button" class="ghost small" id="addband">Add wavelengths</button><select id="addline" class="ghost small"></select></div>
        <h2 id="h_combine">Combine</h2>
        <div id="combine"></div>
        <h2 id="h_whole">Whole picture</h2>
        <div id="whole"></div>
        <button type="button" class="ghost small" id="reset2">Back to the recipe</button>
      </section>

      <section id="outbox">
        <h2 id="h_out">Take it with you</h2>
        <div id="out"></div>
        <div class="rowbtns big"><button type="button" class="cta" id="share">Share</button><button type="button" class="cta" id="save">Save</button><button type="button" class="ghost" id="copy">Copy</button><button type="button" class="ghost" id="link">Copy link</button></div>
        <p class="says" id="outsay" role="status"></p>
        <p class="fine" id="rawnote" hidden></p>
      </section>
      <!-- where the data come from: the cube, its makers, the wavelengths and the very files read -->
      <section class="src" id="srcbox" hidden>
        <p class="fine" id="srcline"></p>
        <details><summary id="srcsum"></summary><ul id="srcfiles"></ul></details>
      </section>
    </div>
  </aside>
</main>
<noscript><p style="padding:20px">The picture studio needs JavaScript.</p></noscript>
<script type="module" src="js/studio/ui.js"></script>
</body>
</html>
