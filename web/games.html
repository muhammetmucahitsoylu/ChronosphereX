<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- inside the Android app: the edges of the glass and the app's bar of places (does nothing in a browser) -->
<script src="js/tabs.js"></script>
<meta name="theme-color" content="#0a0d13">
<script src="js/look.js"></script>
<title>Games · ChronosphereX</title>
<meta name="description" content="Games played on real telescope data: find the dot that moved across the years, and read the traces of water, methane and ice in the light of real objects measured by NASA's SPHEREx.">
<link rel="canonical" href="https://chronospherex.com/games.html">
<meta property="og:title" content="Games · ChronosphereX">
<meta property="og:description" content="Find the dot that moved. Read the fingerprints in starlight. Real telescope data.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://chronospherex.com/games.html">
<meta property="og:image" content="https://chronospherex.com/share.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/fonts.css">
<style>
  :root { --bg: #0a0d13; --surface: #121722; --line: #283246; --ink: #eef2f7; --ink-2: #a8b3c3; --ink-3: #7f8a9c; --ember: #ff7b39; --mint: #5fe0b0; --gold: #f2c14e;
    --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif; --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace; color-scheme: dark; }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); -webkit-text-size-adjust: 100%; }
  [hidden] { display: none !important; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 14px 16px 40px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .logo { font: 26px/1 var(--serif); font-style: italic; text-decoration: none; display: inline-flex; align-items: center; gap: 9px; color: var(--ink); }
  .logo i { width: 15px; height: 15px; border-radius: 50%; background: var(--ember); display: inline-block; }
  select { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; font: 14px var(--sans); }
  h1 { font: 400 38px/1.05 var(--serif); margin: 20px 0 6px; }
  .lede { color: var(--ink-2); margin: 0 0 16px; font-size: 15px; }
  a.card { display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); color: var(--ink); text-decoration: none; margin-bottom: 10px; min-height: 92px; }
  a.card:hover, a.card:focus-visible { border-color: var(--ember); outline: none; }
  a.card svg { flex: none; }
  a.card .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  a.card b { font: 400 25px/1.1 var(--serif); }
  a.card span { color: var(--ink-2); font-size: 14.5px; }
  a.card em { font: 500 12px var(--mono); letter-spacing: .1em; text-transform: uppercase; font-style: normal; color: var(--mint); }
  a.card .go { color: var(--ember); font: 600 22px var(--sans); }
  a.card.daily { background: #1b1608; border-color: #f2c14e55; }
  a.card.daily em { color: var(--gold); }
  a.card.fresh em { color: var(--ember); }
  .fine { color: var(--ink-3); font-size: 13px; margin-top: 20px; }
</style>
<!-- visit counts: no cookies, no IP addresses kept (see About) -->
<script data-goatcounter="https://chronospherex.goatcounter.com/count" async src="/js/count.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="./"><i></i>ChronosphereX</a>
    <select id="lang" aria-label="Language"><option value="en">English</option><option value="tr">Türkçe</option><option value="es">Español</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="pl">Polski</option></select>
  </header>
  <main>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <a class="card daily" id="daily" href="play.html?daily=1">
      <svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#f2c14e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg>
      <span class="t"><b id="dailyt"></b><span id="dailys"></span><em id="dailye"></em></span><span class="go" aria-hidden="true">→</span></a>
    <a class="card" id="mover" href="play.html?daily=0">
      <svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#5fe0b0" stroke-width="1.6" stroke-linecap="round"><circle cx="6" cy="16" r="2.2" stroke-dasharray="2 2"/><circle cx="17" cy="7" r="2.6"/><path d="M8 14.5l7-6"/></svg>
      <span class="t"><b id="movert"></b><span id="movers"></span><em id="movere"></em></span><span class="go" aria-hidden="true">→</span></a>
    <a class="card fresh" id="fp" href="fingerprint.html">
      <svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ff7b39" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8h3l2 8 2-11 2 7h2l2-4 2 6h6"/></svg>
      <span class="t"><b id="fpt"></b><span id="fps"></span><em id="fpe"></em></span><span class="go" aria-hidden="true">→</span></a>
    <p class="fine" id="fine"></p>
  </main>
</div>
<script>
// The games, on one page (28 Nov 2026, the user: "oyun sekmesinde güzel bir sayfa"): today's puzzle, the moving dot's
// ten levels and the light's fingerprint, each saying in a line what it is and what the visitor has done in it. Only
// games that work are listed. The bar's Puzzle place opens this page.
const STR = {
  en: { title: 'Games', lede: 'Real telescope data. Each game teaches itself in a minute, then real objects come at random.',
    dailyt: 'Today’s puzzle', dailys: 'One patch of sky a day: find the dot that moved.', dailyDone: 'Solved today ✓', dailyNew: 'New today',
    movert: 'The dot that moved', movers: 'Ten levels, each harder: pictures years apart.', moverDone: 'Played',
    fpt: 'The light’s fingerprint', fps: 'Find water, methane and ice in real SPHEREx light.', fpNew: 'New · guided', fpBook: '{n} worked out',
    fine: 'Pictures: NASA WISE, NEOWISE and SPHEREx, from NASA/IPAC (IRSA). What you solve stays on this device.' },
  tr: { title: 'Oyunlar', lede: 'Gerçek teleskop verisi. Her oyun bir dakikada kendini öğretir, sonra gerçek cisimler rastgele gelir.',
    dailyt: 'Günün bulmacası', dailys: 'Her gün bir gökyüzü parçası: hareket eden noktayı bul.', dailyDone: 'Bugün çözüldü ✓', dailyNew: 'Bugünkü hazır',
    movert: 'Hareket eden nokta', movers: 'On seviye, her biri daha zor: yıllar arayla çekilmiş görüntüler.', moverDone: 'Oynandı',
    fpt: 'Işığın parmak izi', fps: 'Gerçek SPHEREx ışığında su, metan ve buz izlerini bul.', fpNew: 'Yeni · rehberli', fpBook: '{n} cisim çözüldü',
    fine: 'Görüntüler: NASA WISE, NEOWISE ve SPHEREx; NASA/IPAC (IRSA). Çözdüklerin bu cihazda kalır.' },
  de: { title: 'Spiele', lede: 'Echte Teleskopdaten. Jedes Spiel erklärt sich in einer Minute, dann kommen echte Objekte zufällig.',
    dailyt: 'Rätsel des Tages', dailys: 'Jeden Tag ein Stück Himmel: Finde den Punkt, der sich bewegt hat.', dailyDone: 'Heute gelöst ✓', dailyNew: 'Heute neu',
    movert: 'Der Punkt, der sich bewegt hat', movers: 'Zehn Stufen, jede schwerer: Bilder im Abstand von Jahren.', moverDone: 'Gespielt',
    fpt: 'Der Fingerabdruck des Lichts', fps: 'Finde Wasser, Methan und Eis in echtem SPHEREx-Licht.', fpNew: 'Neu · mit Anleitung', fpBook: '{n} gelöst',
    fine: 'Bilder: NASA WISE, NEOWISE und SPHEREx, von NASA/IPAC (IRSA). Was du löst, bleibt auf diesem Gerät.' },
  fr: { title: 'Jeux', lede: 'De vraies données de télescope. Chaque jeu s’apprend en une minute, puis de vrais objets arrivent au hasard.',
    dailyt: 'Le défi du jour', dailys: 'Un coin de ciel par jour : trouvez le point qui a bougé.', dailyDone: 'Résolu aujourd’hui ✓', dailyNew: 'Nouveau aujourd’hui',
    movert: 'Le point qui a bougé', movers: 'Dix niveaux, chacun plus dur : des images à des années d’écart.', moverDone: 'Joué',
    fpt: 'L’empreinte de la lumière', fps: 'Trouvez l’eau, le méthane et la glace dans la vraie lumière de SPHEREx.', fpNew: 'Nouveau · guidé', fpBook: '{n} résolus',
    fine: 'Images : NASA WISE, NEOWISE et SPHEREx, de NASA/IPAC (IRSA). Ce que vous résolvez reste sur cet appareil.' },
  pl: { title: 'Gry', lede: 'Prawdziwe dane z teleskopów. Każda gra uczy się sama w minutę, potem przychodzą prawdziwe obiekty, losowo.',
    dailyt: 'Zagadka dnia', dailys: 'Codziennie kawałek nieba: znajdź punkt, który się przesunął.', dailyDone: 'Rozwiązana dziś ✓', dailyNew: 'Nowa dziś',
    movert: 'Punkt, który się przesunął', movers: 'Dziesięć poziomów, każdy trudniejszy: zdjęcia sprzed lat.', moverDone: 'Zagrane',
    fpt: 'Odcisk palca światła', fps: 'Znajdź wodę, metan i lód w prawdziwym świetle SPHEREx.', fpNew: 'Nowe · z przewodnikiem', fpBook: 'Rozwiązane: {n}',
    fine: 'Obrazy: NASA WISE, NEOWISE i SPHEREx, z NASA/IPAC (IRSA). To, co rozwiążesz, zostaje na tym urządzeniu.' },
  es: { title: 'Juegos', lede: 'Datos reales de telescopios. Cada juego se aprende en un minuto; luego llegan objetos reales al azar.',
    dailyt: 'El reto de hoy', dailys: 'Un trozo de cielo al día: encuentra el punto que se movió.', dailyDone: 'Resuelto hoy ✓', dailyNew: 'Nuevo hoy',
    movert: 'El punto que se movió', movers: 'Diez niveles, cada uno más difícil: imágenes con años de diferencia.', moverDone: 'Jugado',
    fpt: 'La huella de la luz', fps: 'Encuentra agua, metano y hielo en la luz real de SPHEREx.', fpNew: 'Nuevo · con guía', fpBook: '{n} resueltos',
    fine: 'Imágenes: NASA WISE, NEOWISE y SPHEREx, de NASA/IPAC (IRSA). Lo que resuelvas se queda en este dispositivo.' },
};
const $ = id => document.getElementById(id), q = new URLSearchParams(location.search);
let lang = q.get('lang');
try { lang = lang || localStorage.getItem('chrono-lang'); } catch { /* private mode */ }
if (!STR[lang]) lang = (navigator.languages || [navigator.language || 'en']).map(l => l.slice(0, 2).toLowerCase()).find(l => STR[l]) || 'en';
const T = STR[lang], fill = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k]);
document.documentElement.lang = lang; $('lang').value = lang; document.title = `${T.title} · ChronosphereX`;
$('lang').onchange = () => { try { localStorage.setItem('chrono-lang', $('lang').value); } catch { /* private mode */ } q.set('lang', $('lang').value); location.search = q.toString(); };
for (const k of ['title', 'lede', 'dailyt', 'dailys', 'movert', 'movers', 'fpt', 'fps', 'fine']) $(k).textContent = T[k];
const get = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch { return null; } };
// today's puzzle: done today? (play.html keeps its days under chrono-daily, by the local date)
const d = new Date(), today = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const days = (get('chrono-daily') || {}).days || {};
$('dailye').textContent = days[today] ? T.dailyDone : T.dailyNew;
let played = false; try { played = !!localStorage.getItem('chrono-played'); } catch { /* private mode */ }
$('movere').textContent = played ? T.moverDone : '';
const fpBook = (get('chrono-fp-book') || []).length;
$('fpe').textContent = fpBook ? fill(T.fpBook, { n: fpBook }) : T.fpNew;
for (const a of document.querySelectorAll('a.card')) { const u = new URL(a.getAttribute('href'), location.href); u.searchParams.set('lang', lang); a.href = u.pathname.split('/').pop() + u.search; }
</script>
</body>
</html>
