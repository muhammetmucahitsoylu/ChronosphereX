<style>
  :root { --bg: #0a0908; --surface: #141210; --line: #2f2a25; --ink: #f3eee6; --ink-2: #b0a79a; --ink-3: #8a8175; --ember: #ff7b39; --mint: #5fe0b0; --gold: #f2c14e;
    --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif; --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace; }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); -webkit-text-size-adjust: 100%; }
  a { color: inherit; }
  .wrap { max-width: 600px; margin: 0 auto; padding: 14px 16px 40px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .logo { font: 26px/1 var(--serif); font-style: italic; text-decoration: none; display: inline-flex; align-items: center; gap: 9px; }
  .logo i { width: 15px; height: 15px; border-radius: 50%; background: var(--ember); display: inline-block; }
  select { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; font: 14px var(--sans); }
  h1 { font: 400 38px/1.08 var(--serif); margin: 22px 0 8px; }
  .lede { color: var(--ink-2); margin: 0 0 16px; font-size: 15.5px; }
  .bar { display: flex; justify-content: space-between; align-items: baseline; font: 500 14px var(--mono); color: var(--ink-2); margin-bottom: 8px; letter-spacing: .02em; }
  .bar b { color: var(--gold); font-weight: 500; }
  #clock { color: var(--ink); font-size: 17px; min-width: 4.5em; text-align: right; }
  #lives { display: inline-flex; gap: 6px; align-items: center; }
  #lives i { width: 10px; height: 10px; border-radius: 50%; background: var(--mint); display: inline-block; }
  #lives i.gone { background: none; box-shadow: inset 0 0 0 1.5px var(--ink-3); }
  /* When a level ends, the next one is pressed right above the picture (no scrolling on a desktop screen), where the
     tries were. On narrow screens the clock gives way to it: the time is said in the words below the picture too. */
  #next2 { font: 600 14px/26px var(--sans); height: 26px; min-height: 0; background: var(--ember); color: #1b0b02; border: 0; border-radius: 999px; padding: 0 14px; margin: 0; cursor: pointer; white-space: nowrap; align-self: center; }
  .bar { min-height: 26px; }                                /* the same height with or without the button: the picture does not jump */
  @media (pointer: coarse) { #next2 { height: 34px; line-height: 34px; } .bar { min-height: 34px; } }   /* a finger needs more */
  #next2:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  @media (max-width: 420px) { .bar.done #clock { display: none; } }
  .stage { position: relative; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: #000; touch-action: manipulation; }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 1; cursor: crosshair; }
  #year { position: absolute; left: 12px; bottom: 8px; font: 500 44px/1 var(--mono); text-shadow: 0 0 6px #000, 0 0 2px #000; pointer-events: none; }
  #tel { position: absolute; left: 14px; bottom: 56px; font: 600 12px var(--sans); letter-spacing: .08em; color: #4cc9f0; text-shadow: 0 0 5px #000; pointer-events: none; }
  #card { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 10px; padding: 22px; background: rgba(10, 9, 8, .62); }
  #card b { font: 400 30px/1.12 var(--serif); font-weight: 400; }
  #card p { margin: 0; color: var(--ink); font-size: 15.5px; text-shadow: 0 0 6px #000; }
  #card button { margin-top: 6px; }
  @media (max-width: 380px) { #card { padding: 14px 16px; gap: 6px; } #card b { font-size: 24px; } #card p { font-size: 14px; line-height: 1.42; } #card button { min-height: 42px; padding: 9px 18px; } }
  #say { min-height: 3.2em; margin: 12px 0 4px; font-size: 16px; }
  #say b { color: var(--gold); font-weight: 600; }
  #say .name { font: 400 30px/1.15 var(--serif); display: block; color: var(--ink); }
  .btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  button, .btn { font: 600 15px var(--sans); border-radius: 999px; padding: 11px 20px; min-height: 46px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
  button.go, .btn.go { background: var(--ember); border-color: var(--ember); color: #1b0b02; }
  button.quiet { color: var(--ink-2); }
  button:focus-visible, .btn:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  [hidden] { display: none !important; }
  #sum h2 { font: 400 34px/1.1 var(--serif); margin: 20px 0 4px; }
  #sum p { margin: 0 0 14px; color: var(--ink-2); }
  #sum ol { list-style: none; padding: 0; margin: 0 0 6px; border-top: 1px solid var(--line); }
  #sum li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  #sum li span:last-child { font-family: var(--mono); color: var(--ink-2); white-space: nowrap; }
  #sum li.hit span:last-child { color: var(--mint); }
  .fine { color: var(--ink-3); font-size: 13.5px; margin-top: 26px; }

  .dailygo { margin: -8px 0 14px; font-size: 15px; }
  .dailygo a, #todaybtn { color: var(--gold); text-decoration: none; font-weight: 600; }
  #say .daily { display: block; margin-top: 6px; color: var(--ink-2); font-size: 14.5px; }
  .shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  @media (prefers-reduced-motion: reduce) { .shake { animation: none; } }

  @media (max-width: 600px), (orientation: landscape) and (max-height: 500px) { .lede .more { display: none; } }
  /* a phone held sideways: the picture on the left, as tall as the screen; the words and the buttons beside it */
  @media (orientation: landscape) and (max-height: 500px) and (min-width: 600px) {
    .wrap { max-width: none; margin: 0; padding: 10px 16px 16px calc(100vh + 16px + var(--sal, env(safe-area-inset-left, 0px))); }
    @supports (height: 100dvh) { .wrap { padding-left: calc(100dvh + 16px + var(--sal, env(safe-area-inset-left, 0px))); } }
    .wrap:has(#game[hidden]) { padding-left: calc(16px + var(--sal, env(safe-area-inset-left, 0px))); }          /* the result has no picture: the whole width */
    .stage { position: fixed; left: var(--sal, env(safe-area-inset-left, 0px)); top: 0; width: 100vh; height: 100vh; border: 0; border-right: 1px solid var(--line); border-radius: 0; }
    @supports (height: 100dvh) { .stage { width: 100dvh; height: 100dvh; } }
    canvas { width: 100%; height: 100%; }
    /* once a star has been answered the opening words have done their work: their room goes to the answer. (The picture
       does not move for it: it is fixed beside them.) And the buttons stay at the foot of the screen. */
    body.played h1, body.played .lede, body.played .dailygo { display: none; }
    .dailygo { margin: -2px 0 8px; font-size: 14px; }
    body.played .bar { margin-top: 10px; }
    #game .btns { position: sticky; bottom: 0; z-index: 2; margin: 6px -16px 0; padding: 8px 16px calc(8px + var(--edge-b, env(safe-area-inset-bottom, 0px))); background: linear-gradient(0deg, var(--bg) 80%, transparent); }
    .logo { font-size: 22px; }
    h1 { font-size: 26px; margin: 8px 0 4px; }
    .lede { font-size: 14px; line-height: 1.4; margin-bottom: 8px; }
    .bar { margin-bottom: 4px; }
    #say { min-height: 2.9em; margin: 6px 0 2px; font-size: 15px; }
    #say .name { font-size: 24px; }
    .btns { gap: 8px; margin-top: 6px; }
    button, .btn { min-height: 42px; padding: 8px 16px; font-size: 14.5px; }
    .fine { margin-top: 14px; font-size: 13px; }
    #card { padding: 14px 18px; gap: 6px; }
    #card b { font-size: 24px; }
    #card p { font-size: 14px; line-height: 1.42; }

const POOLFACT = {
  en: 'A brown dwarf about {ly} light-years away: too small to shine as a star does.',
  tr: 'Yaklaşık {ly} ışık yılı uzaklıkta bir kahverengi cüce: yıldız gibi parlayamayacak kadar küçük.',
  es: 'Una enana marrón a unos {ly} años luz: demasiado pequeña para brillar como una estrella.',
  de: 'Ein Brauner Zwerg, etwa {ly} Lichtjahre entfernt: zu klein, um wie ein Stern zu leuchten.',
  fr: 'Une naine brune à environ {ly} années-lumière : trop petite pour briller comme une étoile.',
  pl: 'Brązowy karzeł oddalony o około {ly} lat świetlnych: zbyt mały, by świecić jak gwiazda.',
};
const SEEN = 'chrono-game-seen';
function seenIds() { try { return new Set(JSON.parse(localStorage.getItem(SEEN) || '[]')); } catch { return new Set(); } }
function markSeen(id) { try { const s = seenIds(); s.add(id); localStorage.setItem(SEEN, JSON.stringify([...s])); } catch { /* private mode */ } }
function pickLevels(pool) {
  let seen = seenIds(); const chosen = new Set(), levels = [];
  for (let i = 0; i < 2 * pool.bins; i++) {
    const bin = 1 + (i % pool.bins), all = pool.stars.filter(s => s.bin === bin && !chosen.has(s.id));
    let free = all.filter(s => !seen.has(s.id));
    if (!free.length) {                                      // this bin is used up: its stars may come again, the other bins' not yet
      const mine = new Set(pool.stars.filter(s => s.bin === bin).map(s => s.id));
      seen = new Set([...seen].filter(id => !mine.has(id)));
      try { localStorage.setItem(SEEN, JSON.stringify([...seen])); } catch { /* */ }
      free = all;
    }
    const s = free[Math.floor(Math.random() * free.length)]; chosen.add(s.id);
    levels.push(poolLevel(s, i >= pool.bins));
  }
  return levels;
}
function poolLevel(s, dark) {
  const ly = s.ly ? String(Math.round(s.ly)) : '65';
  return { ...s, base: s.pos, slug: s.id, src: `game/pool/${s.file || `${s.id}.webp`}`, dark, open: null, fact: fill(POOLFACT[lang] || POOLFACT.en, { ly }) };
}
// A level whose picture did not come (a dropped connection, a file of an older release gone): another star of the
// same bin takes its place; after a few, or without a pool, the fixed ten levels from the start.
const failed = new Set();
function lost(i) {
  const was = DATA.levels[i]; failed.add(was.id); pics.delete(was.id);
  if (DATA.pool && failed.size < 5) {
    const inUse = new Set(DATA.levels.map(l => l.id)), free = DATA.pool.stars.filter(s => s.bin === was.bin && !inUse.has(s.id) && !failed.has(s.id));
    if (free.length) { DATA.levels[i] = poolLevel(free[Math.floor(Math.random() * free.length)], was.dark); return start(i); }
  }
  if (!DATA.pool) { $('say').textContent = '…'; return; }
  fetch('game/levels.json').then(r => r.json()).then(d => { clearInterval(tick); results = []; go(d); }).catch(() => { $('say').textContent = '…'; });
}
// A pool star is turned a quarter, half or three quarters and maybe mirrored, at random each time it is played: the
// sky has no up in this game, and a star that comes again after the pool ran out is not known by where it sat on the
// screen. Only ways that keep its places off the year and the telescope's name in the lower left corner (#year, #tel:
// fixed screen pixels, so measured on the picture as it is shown) and a star's width round them: all its visits if
// one can (the walk shown afterwards), else the two of the level.
function orient(L) {
  const S = L.size, w = cv.getBoundingClientRect().width, k = S / (w > 50 ? w : 360);
  const bx = 150 * k + 5, by = S - 84 * k - 5;
  const turned = (turn, mirror) => L.base.map(([x, y]) => { if (mirror) x = S - x; for (let t = 0; t < turn; t++) [x, y] = [S - y, x]; return [x, y]; });
  const clear = p => p[0] > bx || p[1] < by;
  const all = [], two = [];
  for (let turn = 0; turn < 4; turn++) for (const mirror of [false, true]) {
    const pos = turned(turn, mirror), way = { turn, mirror, pos };
    if (pos.every(clear)) all.push(way); else if (clear(pos[L.a]) && clear(pos[L.b])) two.push(way);
  }
  const ways = all.length ? all : two.length ? two : [{ turn: 0, mirror: false, pos: L.base }];
  Object.assign(L, ways[L.day == null ? Math.floor(Math.random() * ways.length) : (3 * L.day + 1) % ways.length]);          // today's board: the same way all day, another one tomorrow
}
// Pictures are fetched one level ahead: the first before the game starts, the next while the current one is played.
const pics = new Map();
function pic(l) {
  if (!l) return null;
  if (!pics.has(l.id)) {
    const img = new Image(); img.decoding = 'async'; img.src = l.src || `game/${l.id}.webp`;
    pics.set(l.id, img.decode().catch(() => new Promise(r => { if (img.complete) r(); else { img.onload = r; img.onerror = r; } })).then(() => img));
  }
  return pics.get(l.id);
}

const cv = $('cv'), ctx = cv.getContext('2d'), C = cv.width;
let DATA = null, L = null, strip = null, phase = 'load', frame = 0, shade = 0, loop = 0, since = 0, tick = 0, t0 = 0, level = 0, tries = 0, results = [], miss = null;
const MINT = '#5fe0b0', RED = '#ff5c50';
// Each picture stays half a second. On the levels marked dark the picture then closes to black and opens again on the
// other one, like a blink (CLOSE, SHUT, OPEN): the two are never on the screen together, so the jump no longer catches
// the eye by itself and the stars have to be compared one by one (the "flicker" of Rensink, O'Regan & Clark 1997, who
// used 240 ms pictures and 80 ms blanks). The first version cut to black for a quarter second, and a player took it
// for the game hanging; the first of these levels now says what is coming before its clock starts (#card).
const SHOW = 500, CLOSE = 100, SHUT = 100, OPEN = 100;

function draw() {
  if (!strip) return;
  const S = L.size, k = C / S;
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.save(); ctx.translate(C / 2, C / 2); ctx.rotate((L.turn || 0) * Math.PI / 2); if (L.mirror) ctx.scale(-1, 1);          // as orient() turned its places
  ctx.drawImage(strip, frame * S, 0, S, S, -C / 2, -C / 2, C, C); ctx.restore();
  if (shade > 0) { ctx.fillStyle = `rgba(0, 0, 0, ${shade.toFixed(3)})`; ctx.fillRect(0, 0, C, C); }
  if (phase === 'walk' || phase === 'done') {             // where it has been, and the ring round where it is
    ctx.fillStyle = 'rgba(95, 224, 176, .75)';
    for (let i = 0; i <= frame; i++) { ctx.beginPath(); ctx.arc(L.pos[i][0] * k, L.pos[i][1] * k, 3.5, 0, 2 * Math.PI); ctx.fill(); }
    ctx.strokeStyle = MINT; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(L.pos[frame][0] * k, L.pos[frame][1] * k, 26, 0, 2 * Math.PI); ctx.stroke();
  }
  if (miss && performance.now() - miss.at < 500) {         // a press on the wrong place, seen even while the picture is dark
    ctx.strokeStyle = RED; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(miss.x * k, miss.y * k, 20, 0, 2 * Math.PI); ctx.stroke();
  }
  const y = Math.floor(L.years[frame]);
  $('year').textContent = y; $('year').style.color = frame === L.a ? '#4cc9f0' : frame === L.b ? '#f2c14e' : '#f3eee6';
  $('tel').textContent = y < 2012 ? 'NASA WISE' : 'NASA NEOWISE';
  $('year').style.opacity = $('tel').style.opacity = phase === 'card' ? '0' : String(1 - shade);          // under the card the button stands where the year is
}
function clock() { if (phase === 'play') $('clock').textContent = `${secs(performance.now() - t0)} s`; }
const TRIES = 3;                                             // wrong presses a level allows: pressing every bright star is no way through
function lives() {
  const left = Math.max(0, TRIES - tries);
  $('lives').innerHTML = Array.from({ length: TRIES }, (_, i) => `<i${i < left ? '' : ' class="gone"'}></i>`).join('');
  $('lives').setAttribute('aria-label', fill(T.lives, { n: left }));
}

// A level shows two of the star's visits in turn (L.a and L.b), blinking dark between them when L.dark. Which picture
// and how dark follow from the time since the level began, drawn on every frame of the screen that changes them.
function flip(now) {
  if (phase !== 'play') return;
  const t = now - since; let f, s = 0;
  if (!L.dark) f = Math.floor(t / SHOW) % 2;
  else {
    const P = SHOW + CLOSE + SHUT + OPEN, n = Math.floor(t / P), u = t - n * P;
    f = n % 2;
    if (u >= SHOW + CLOSE + SHUT) { f = 1 - f; s = 1 - (u - SHOW - CLOSE - SHUT) / OPEN; }          // opening on the other one
    else if (u >= SHOW + CLOSE) s = 1;
    else if (u >= SHOW) s = (u - SHOW) / CLOSE;
  }
  const fr = f ? L.b : L.a;
  if (fr !== frame || Math.abs(s - shade) > 0.004) { frame = fr; shade = s; draw(); }
  loop = requestAnimationFrame(flip);
}
function play() { phase = 'play'; t0 = since = performance.now(); frame = L.a; shade = 0; draw(); loop = requestAnimationFrame(flip); }
async function start(i) {
  level = i; L = DATA.levels[i]; phase = 'load'; tries = 0; miss = null; cancelAnimationFrame(loop); shade = 0; lives();
  $('level').innerHTML = daily ? `${T.daily} <b>#${TODAY.no}</b>` : fill(T.level, { k: `<b>${i + 1}</b>`, n: DATA.levels.length }); $('clock').textContent = '';
  $('say').textContent = ''; $('next').hidden = true; $('next2').hidden = true; $('lives').hidden = false; $('stage').previousElementSibling.classList.remove('done'); $('open').hidden = true; $('other').hidden = true; $('show').hidden = false; $('card').hidden = true;
  const img = await pic(L);
  if (level !== i) return;
  if (!img.naturalWidth) return lost(i);
  pic(DATA.levels[i + 1]);                                   // the next level's pictures, while this one is played
  strip = img; frame = L.a; if (L.base) orient(L);
  if (daily && kept().days?.[TODAY.key]) return dailyShown();
  $('say').textContent = fill(T.pair, { a: Math.floor(L.years[L.a]), b: Math.floor(L.years[L.b]) }) + (L.dark ? ` ${T.dark}` : '');
  if (L.dark && (daily || i === DATA.levels.findIndex(l => l.dark))) {          // the first blinking level: say so before the clock runs
    phase = 'card'; shade = 0.55; draw(); $('card').hidden = false; $('cardgo').focus({ preventScroll: true });
    $('cardgo').onclick = () => { $('card').hidden = true; play(); };
  } else play();
}
function reveal(found, out = false) {
  if (phase !== 'play') return;
  const took = performance.now() - t0; cancelAnimationFrame(loop); shade = 0; phase = 'walk'; $('show').hidden = true; $('say').textContent = '';
  document.body.classList.add('played');
  try { localStorage.setItem('chrono-played', '1'); } catch { /* private mode */ }
  if (L.src && !daily) markSeen(L.id);          // today's star is everyone's: it does not use up the visitor's own draw from the pool
  results[level] = { slug: L.slug, name: L.name, found, ms: took, tries, a: Math.floor(L.years[L.a]), b: Math.floor(L.years[L.b]) };
  $('clock').textContent = found ? `${secs(took)} s` : '';
  frame = 0; draw();
  const step = setInterval(() => {                           // its walk through every visit
    if (frame < L.n - 1) { frame++; draw(); return; }
    clearInterval(step); phase = 'done';
    const last = level === DATA.levels.length - 1;
    $('say').innerHTML = `<span class="name">${T.names[L.slug] || L.name}</span>${found ? fill(T.found, { s: secs(took) }) : `${out ? `${T.out} ` : ''}${T.shown}`}. ${T.facts[L.id] || T.facts[L.slug] || L.fact} ${fill(T.walk, { n: L.n, a: Math.floor(L.years[0]), b: Math.floor(L.years[L.n - 1]) })}`;
    $('next').textContent = daily ? T.share : last ? T.result : T.next; $('next').hidden = false;
    $('lives').hidden = true; $('stage').previousElementSibling.classList.add('done');
    if (daily) dailyEnd(found, took);          // one board a day: what comes next is passing it on, below the picture
    else { $('next2').textContent = `${last ? T.result : T.next} →`; $('next2').hidden = false; }
    requestAnimationFrame(() => $('next').parentNode.scrollIntoView({ block: 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }));          // a small screen: the answer and what comes next move into view
    $('open').hidden = !L.open; if (L.open) { $('open').textContent = T.open; $('open').href = `./${L.open}&lang=${lang}`; }          // the faint ones of the last levels have no page in the tool
    (daily ? $('next') : $('next2')).focus({ preventScroll: true });
  }, 110);
}
// A press counts when the finger (or the mouse) comes up near where it went down. Not when it went down: on a phone
// a finger that starts to scroll the page over the picture, or two fingers that zoom it, are not presses, and used
// to cost a try. The browser says so with pointercancel; a second finger is not the primary pointer.
let press = null;
cv.addEventListener('pointerdown', e => { press = phase === 'play' && e.isPrimary ? { id: e.pointerId, x: e.clientX, y: e.clientY } : null; });
cv.addEventListener('pointercancel', () => { press = null; });
window.addEventListener('pointerup', e => {
  const p = press; press = null;
  if (!p || p.id !== e.pointerId || phase !== 'play' || Math.hypot(e.clientX - p.x, e.clientY - p.y) > 12) return;
  tap(p.x, p.y);
});
// Where a press counts: anywhere near the line between the star's two places. The pictures flip, so the eye sees the
// star slide back and forth along that line and the finger goes to the middle of it, which on a long jump is far from
// both ends. Near: 24 pixels of the screen (a finger's width), and never less than 8 of the picture (25 arcseconds);
// in a crowded field a wider ring would take in the neighbours.
function along(x, y, p, q) {
  const vx = q[0] - p[0], vy = q[1] - p[1], l2 = vx * vx + vy * vy, u = l2 ? Math.max(0, Math.min(1, ((x - p[0]) * vx + (y - p[1]) * vy) / l2)) : 0;
  return Math.hypot(x - p[0] - u * vx, y - p[1] - u * vy);
}
function tap(cx, cy) {
  const r = cv.getBoundingClientRect(), S = L.size, x = (cx - r.left) / r.width * S, y = (cy - r.top) / r.height * S;
  if (along(x, y, L.pos[L.a], L.pos[L.b]) <= Math.max(8, 24 * S / r.width)) { buzz([25, 60, 25]); return reveal(true); }
  buzz(45);
  tries++; lives(); miss = { x, y, at: performance.now() }; draw(); setTimeout(draw, 520);
  $('stage').classList.remove('shake'); void $('stage').offsetWidth; $('stage').classList.add('shake');
  if (tries >= TRIES) return reveal(false, true);
  $('say').textContent = T.wrong;
}
$('show').onclick = () => reveal(false);
$('next').onclick = () => { if (daily) shareDaily(); else if (level < DATA.levels.length - 1) start(level + 1); else summary(); };
$('next2').onclick = () => $('next').click();
// On a keyboard: Enter, the space bar or the right arrow goes on once a level has ended (not on today's board, where the button passes the result on).
document.addEventListener('keydown', e => {
  if (daily || $('next').hidden || $('game').hidden || e.altKey || e.ctrlKey || e.metaKey || !['Enter', ' ', 'ArrowRight'].includes(e.key)) return;
  const t = e.target.closest ? e.target.closest('button, a, select, input, textarea') : null;
  if (t && !(t.id === 'next' || t.id === 'next2') || (t && e.key !== 'ArrowRight')) return;          // a focused control answers Enter and space itself
  e.preventDefault(); $('next').click();
});
function summary() {
  const n = DATA.levels.length, hits = results.filter(r => r && r.found), total = hits.reduce((a, r) => a + r.ms, 0);
  $('game').hidden = true; $('sum').hidden = false;
  $('sumtitle').textContent = fill(T.sum, { k: hits.length, n }); $('sumtotal').textContent = hits.length ? fill(T.total, { s: secs(total) }) : '';
  $('sumlist').innerHTML = results.map(r => `<li class="${r.found ? 'hit' : ''}"><span>${T.names[r.slug] || r.name} · ${r.a}–${r.b}</span><span>${r.found ? `${secs(r.ms)} s` : T.dash}</span></li>`).join('');
  $('share').onclick = async () => {
    const url = `${location.origin}${location.pathname}`, text = fill(T.shareText, { k: hits.length, n, s: secs(total) });
    try {
      if (navigator.share) await navigator.share({ text, url });
      else { await navigator.clipboard.writeText(`${text} ${url}`); $('share').textContent = T.copied; setTimeout(() => { $('share').textContent = T.share; }, 2500); }
    } catch { /* the visitor closed the sheet */ }
  };
  $('sum').scrollIntoView({ block: 'start' });
}
$('again').onclick = () => { results = []; if (DATA.pool) DATA.levels = pickLevels(DATA.pool); $('sum').hidden = true; $('game').hidden = false; start(0); };
// The pool when there is one (a new draw of stars every game); the fixed ten levels of game/levels.json otherwise.
// Today's star is one board from whichever of the two is there (todays()).
const go = d => { DATA = d; if (daily) DATA.levels = [todays(d)]; pic(DATA.levels[0]); tick = setInterval(clock, 100); start(0); };
fetch('game/pool.json').then(r => r.ok ? r.json() : Promise.reject())
  .then(p => { if (!p.stars || p.stars.length < 4 * p.bins) throw 0; for (let b = 1; b <= p.bins; b++) if (p.stars.filter(s => s.bin === b).length < 2) throw 0; go({ pool: p, scale: p.scale, levels: daily ? [] : pickLevels(p) }); })
  .catch(() => fetch('game/levels.json').then(r => r.json()).then(go))
  .catch(() => { $('say').textContent = '…'; });
</script>
